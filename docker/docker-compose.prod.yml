# docker/docker-compose.prod.yml
services:
  aims-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: always
    environment:
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8080
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-root@123}@host.docker.internal:5432/AIMS
      SESSION_COOKIE_NAME: aims_session
      ALLOWED_ORIGINS: http://aims.internal,https://aims.internal,http://aims.local,https://aims.local,http://amis.local,https://amis.local,http://localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aims-internal
      - production_default

  aims-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-root@123}@host.docker.internal:5432/AIMS
      WORKER_CONCURRENCY: 4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aims-internal

  aims-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - aims-api
    networks:
      - aims-internal
      - production_default

  aims-proxy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "8085:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - aims-web
      - aims-api
    networks:
      - aims-internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  aims-internal:
    driver: bridge
  production_default:
    external: true
