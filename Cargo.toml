[workspace]
members = [
    "apps/api",
    "apps/worker",
    "crates/common",
    "crates/domain",
    "crates/database",
    "crates/auth",
    "crates/import_engine",
    "crates/attendance_engine",
    "crates/reporting",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Byte <aims@internal>"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
dotenvy = "0.15"

[package]
name = "aims_root_tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aims_attendance_engine = { path = "crates/attendance_engine" }
aims_domain = { path = "crates/domain" }
chrono = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "attendance_calculation_test"
path = "tests/attendance_calculation_test.rs"
