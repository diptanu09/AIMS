[workspace]
resolver = "2"

members = [
    "apps/api",
    "apps/worker",
    "crates/common",
    "crates/domain",
    "crates/database",
    "crates/auth",
    "crates/import_engine",
    "crates/attendance_engine",
    "crates/reporting",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["AIMS Development Team"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json"
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
