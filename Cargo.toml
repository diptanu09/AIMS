[workspace]
members = [
    "apps/api",
    "apps/worker",
    "crates/common",
    "crates/domain",
    "crates/database",
    "crates/auth",
    "crates/import_engine",
    "crates/attendance_engine",
    "crates/reporting",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Byte <aims@internal>"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-full", "cors", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
dotenvy = "0.15"
http = "1"
argon2 = "0.5"
axum-extra = { version = "0.10", features = ["cookie"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
time = "0.3"
validator = { version = "0.20", features = ["derive"] }
chrono-tz = "0.10"
csv = "1.3"

[package]
name = "aims_root_tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aims_attendance_engine = { path = "crates/attendance_engine" }
aims_auth = { path = "crates/auth" }
aims_common = { path = "crates/common" }
aims_database = { path = "crates/database" }
aims_domain = { path = "crates/domain" }
aims_import_engine = { path = "crates/import_engine" }
aims_reporting = { path = "crates/reporting" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "attendance_calculation_test"
path = "tests/attendance_calculation_test.rs"

[[test]]
name = "master_data_test"
path = "tests/master_data_test.rs"

[[test]]
name = "attendance_import_test"
path = "tests/attendance_import_test.rs"

[[test]]
name = "attendance_query_test"
path = "tests/attendance_query_test.rs"

[[test]]
name = "report_engine_test"
path = "tests/report_engine_test.rs"

[[test]]
name = "administrative_workflow_test"
path = "tests/administrative_workflow_test.rs"

[[test]]
name = "security_hardening_test"
path = "tests/security_hardening_test.rs"

[[test]]
name = "performance_benchmark_test"
path = "tests/performance_benchmark_test.rs"
